<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio MiguelicooMR1 · Rótulo</title>
<meta name="description" content="Webs para eventos y negocios, hechas por MiguelicooMR1.">
<meta name="theme-color" content="#f6c515">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #f6c515;
    --sun-deep: #e8b400;
    --ink: #14182b;
    --red: #d7372b;
    --cream: #fff6da;
    --display: "Bowlby One", "Arial Black", sans-serif;
    --body: "Hanken Grotesk", system-ui, sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--sun); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--ink); color: var(--sun); }
  * { scrollbar-color: var(--ink) var(--sun); scrollbar-width: thin; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 4px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* toldo */
  .awning { height: 44px; background: repeating-linear-gradient(90deg, var(--red) 0 56px, var(--cream) 56px 112px); position: relative; }
  .awning::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 22px;
    background: repeating-linear-gradient(90deg, var(--red) 0 56px, var(--cream) 56px 112px);
    -webkit-mask: radial-gradient(28px 22px at 28px 0, #000 98%, transparent) 0 0 / 56px 22px repeat-x;
            mask: radial-gradient(28px 22px at 28px 0, #000 98%, transparent) 0 0 / 56px 22px repeat-x; }

  nav { display: flex; justify-content: space-between; align-items: center; padding: 52px 0 0; font-weight: 700; }
  nav .brand { font-family: var(--display); font-size: 1.1rem; text-decoration: none; }
  nav a.c { text-decoration: none; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 18px; transition: background .2s, color .2s; }
  nav a.c:hover { background: var(--ink); color: var(--sun); }

  /* hero: el cartel */
  .hero { padding: 56px 0 72px; }
  .sign { background: var(--ink); color: var(--sun); border-radius: 18px; padding: clamp(28px, 6vw, 64px); position: relative; box-shadow: 0 22px 40px -18px rgba(20,24,43,.55); }
  .sign::before, .sign::after { content: ""; position: absolute; top: 18px; width: 12px; height: 12px; border-radius: 50%; background: var(--sun); opacity: .9; }
  .sign::before { left: 18px; } .sign::after { right: 18px; }
  .sign h1 { font-family: var(--display); font-weight: 400; font-size: min(6.7vw, 5.4rem); line-height: .95; text-transform: uppercase; letter-spacing: -.01em; white-space: nowrap; }
  .sign h1 span { color: var(--cream); }
  .hero-row { display: flex; flex-wrap: wrap; gap: 28px 48px; align-items: center; justify-content: space-between; margin-top: 44px; }
  .lede { font-size: clamp(1.3rem, 3vw, 1.8rem); font-weight: 700; max-width: 26ch; line-height: 1.2; color: var(--cream); }
  .btn { display: inline-flex; gap: 10px; align-items: center; background: var(--red); color: var(--cream); font-weight: 700; font-size: 1.1rem; padding: 16px 28px; border-radius: 999px; text-decoration: none; box-shadow: 0 6px 0 #8f2119; transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
  .btn:hover { transform: translateY(3px); box-shadow: 0 3px 0 #8f2119; }
  .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #8f2119; }
  .btn svg { width: 20px; height: 20px; }
  .sub { margin-top: 22px; font-weight: 500; max-width: 52ch; }

  /* cinta */
  .ribbon { background: var(--ink); color: var(--sun); overflow: hidden; border-block: 4px solid var(--ink); }
  .ribbon div { display: flex; width: max-content; animation: slide 38s linear infinite; font-family: var(--display); text-transform: uppercase; font-size: 1.3rem; padding: 14px 0; }
  .ribbon span { padding: 0 26px; white-space: nowrap; }
  .ribbon span::after { content: "✦"; margin-left: 52px; color: var(--red); }
  @keyframes slide { to { transform: translateX(-50%); } }

  /* proyectos = escaparates */
  h2.t { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1; padding: 88px 0 16px; }
  .shop { display: grid; gap: 28px 56px; align-items: center; padding: 48px 0; }
  @media (min-width: 900px) { .shop { grid-template-columns: 7fr 5fr; padding: 64px 0; } .shop:nth-of-type(even) .window { order: 2; } }
  .window { position: relative; display: block; text-decoration: none; background: var(--cream); border: 6px solid var(--ink); border-radius: 12px; overflow: hidden; aspect-ratio: 16/10; box-shadow: 0 26px 40px -22px rgba(20,24,43,.6); }
  .window img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform 1.2s var(--ease); }
  .window:hover img { transform: scale(1.04); }
  .window .host { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 1.3rem; color: var(--ink); opacity: .25; z-index: 0; }
  .window img { position: relative; z-index: 1; }
  .window .open { position: absolute; right: 14px; bottom: 14px; z-index: 2; background: var(--red); color: var(--cream); font-weight: 700; padding: 8px 16px; border-radius: 999px; opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .35s var(--ease); }
  .window:hover .open, .window:focus-visible .open { opacity: 1; transform: none; }
  @media (hover: none) { .window .open { opacity: 1; transform: none; } }
  .shop h3 { display: flex; align-items: center; gap: 14px; font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(1.9rem, 4.4vw, 2.8rem); line-height: 1; }
  .shop .logo { width: 44px; height: 44px; border-radius: 10px; border: 3px solid var(--ink); background: var(--cream); flex: none; object-fit: cover; }
  .shop p { margin-top: 18px; max-width: 46ch; font-weight: 500; }
  .tags { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .tags li { background: var(--cream); border: 3px solid var(--ink); border-radius: 8px; padding: 2px 12px; font-weight: 700; font-size: .9rem; transform: rotate(-1.5deg); }
  .tags li:nth-child(even) { transform: rotate(1.2deg); }
  .go { display: inline-flex; align-items: center; gap: 8px; margin-top: 24px; font-weight: 700; text-decoration: none; border-bottom: 3px solid var(--ink); transition: gap .3s var(--ease); }
  .go:hover { gap: 14px; }
  .go svg { width: 18px; height: 18px; }

  /* el toldo cae al entrar */
  .js .shop .window { clip-path: inset(0 0 100% 0); transition: clip-path 1s var(--ease); }
  .js .shop.in .window { clip-path: inset(0 0 0 0); }
  .js .shop .info { opacity: 0; transform: translateY(18px); transition: opacity .7s var(--ease) .2s, transform .8s var(--ease) .2s; }
  .js .shop.in .info { opacity: 1; transform: none; }

  /* contacto */
  .contact { background: var(--ink); color: var(--cream); margin-top: 72px; padding: 88px 0 64px; }
  .contact h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; font-size: clamp(2.4rem, 9vw, 5.2rem); line-height: 1; text-wrap: balance; }
  .contact h2 em { font-style: normal; color: var(--sun); }
  .contact > .wrap > p { margin-top: 20px; max-width: 44ch; opacity: .85; }
  .plates { list-style: none; padding: 0; margin-top: 44px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .plates a { display: block; background: var(--sun); color: var(--ink); border-radius: 14px; padding: 22px 24px; text-decoration: none; box-shadow: 0 6px 0 var(--sun-deep); transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
  .plates a:hover { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-deep); }
  .plates .l { display: block; font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
  .plates .v { display: block; font-family: var(--display); font-size: clamp(1.15rem, 2.6vw, 1.5rem); margin-top: 6px; overflow-wrap: anywhere; line-height: 1.15; }
  footer { background: var(--ink); color: var(--cream); padding: 28px 0 40px; font-size: .9rem; opacity: 1; }
  footer .wrap { border-top: 1px solid rgba(255,246,218,.25); padding-top: 24px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .ribbon div { animation: none; }
    .js .shop .window, .js .shop .info { clip-path: none !important; opacity: 1 !important; transform: none !important; transition: none; }
  }
</style>
</head>
<body>
<div class="awning" aria-hidden="true"></div>
<header class="wrap">
  <nav>
    <a class="brand" href="#top" id="top">MiguelicooMR1</a>
    <a class="c" href="#contacto">Contacto</a>
  </nav>
  <div class="hero">
    <div class="sign">
      <h1>Miguelicoo<span>MR1</span></h1>
      <div class="hero-row">
        <p class="lede">Ayudándote a mejorar tu negocio.</p>
        <a class="btn" href="#contacto">Hablemos
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
    <p class="sub">Diseño y desarrollo de webs para eventos y negocios.</p>
  </div>
</header>

<div class="ribbon" aria-hidden="true"><div id="ribbon"></div></div>

<main class="wrap">
  <h2 class="t" id="proyectos">Proyectos</h2>
  <div id="projects"></div>
</main>

<section class="contact" id="contacto">
  <div class="wrap">
    <h2>¿Tienes un proyecto? <em>Hablemos.</em></h2>
    <p>Cuéntame qué necesita tu negocio y lo vemos.</p>
    <ul class="plates" id="plates"></ul>
  </div>
</section>
<footer><div class="wrap">© <span id="year"></span> MiguelicooMR1</div></footer>

<script src="data.js"></script>
<script>
  document.documentElement.classList.add("js");
  const P = window.PORTFOLIO;
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';

  const names = P.projects.map(p => "<span>" + p.name + "</span>").join("");
  document.getElementById("ribbon").innerHTML = names + names + names + names;

  const list = document.getElementById("projects");
  for (const p of P.projects) {
    const art = document.createElement("article");
    art.className = "shop";
    art.innerHTML =
      '<a class="window" target="_blank" rel="noopener noreferrer" aria-label="Visitar ' + p.name + '"><span class="host"></span><span class="open">Abrir web ↗</span></a>' +
      '<div class="info"><h3><img class="logo" width="44" height="44"><span class="n"></span></h3><p class="d"></p><ul class="tags"></ul>' +
      '<a class="go" target="_blank" rel="noopener noreferrer"><span class="h"></span>' + arrow + '</a></div>';
    const w = art.querySelector(".window");
    w.href = p.url;
    art.querySelector(".host").textContent = P.host(p);
    P.shot(w, p);
    P.logo(art.querySelector(".logo"), p);
    art.querySelector(".n").textContent = p.name;
    art.querySelector(".d").textContent = p.description;
    for (const t of p.tags) { const li = document.createElement("li"); li.textContent = t; art.querySelector(".tags").appendChild(li); }
    const g = art.querySelector(".go"); g.href = p.url; art.querySelector(".h").textContent = P.host(p);
    list.appendChild(art);
  }
  P.reveal(".shop");

  const plates = document.getElementById("plates");
  for (const c of P.contact) {
    const li = document.createElement("li");
    li.innerHTML = '<a><span class="l"></span><span class="v"></span></a>';
    const a = li.firstChild; a.href = c.href;
    if (c.ext) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.querySelector(".l").textContent = c.label; a.querySelector(".v").textContent = c.value;
    plates.appendChild(li);
  }
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
