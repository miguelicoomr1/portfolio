<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio MiguelicooMR1 · Manual de montaje</title>
<meta name="description" content="Webs para eventos y negocios, hechas por MiguelicooMR1.">
<meta name="theme-color" content="#8fd3f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #8fd3f4;
    --sky-deep: #6cbfe6;
    --paper: #fffdf6;
    --ink: #101418;
    --red: #e3242b;
    --yellow: #ffd21f;
    --display: "Lilita One", "Arial Rounded MT Bold", sans-serif;
    --body: "Hanken Grotesk", system-ui, sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --stud: 28px;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background-color: var(--sky);
    background-image: radial-gradient(circle, var(--sky-deep) 3px, transparent 3.5px);
    background-size: var(--stud) var(--stud);
    color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--red); color: #fff; }
  * { scrollbar-color: var(--ink) var(--sky); scrollbar-width: thin; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 4px; border-radius: 4px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  .sheet { background: var(--paper); border: 4px solid var(--ink); border-radius: 18px; padding: clamp(20px, 4vw, 44px); margin: 28px 0; position: relative; box-shadow: 0 14px 0 -6px rgba(16,20,24,.18); }
  .num { font-family: var(--display); line-height: .8; color: var(--ink); -webkit-text-stroke: 0; }

  nav { display: flex; justify-content: space-between; align-items: center; padding: 22px 0 0; font-weight: 700; }
  nav .brand { font-family: var(--display); font-size: 1.3rem; text-decoration: none; letter-spacing: .02em; }
  nav a.c { text-decoration: none; background: var(--yellow); border: 3px solid var(--ink); border-radius: 12px; padding: 6px 16px; transition: transform .2s var(--ease); }
  nav a.c:hover { transform: translateY(-3px) rotate(-2deg); }

  /* hero = portada + inventario */
  .cover { display: grid; gap: 28px 48px; align-items: center; }
  @media (min-width: 900px) { .cover { grid-template-columns: 1.15fr .85fr; } }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.6rem, 11vw, 5.6rem); line-height: .95; }
  h1 em { font-style: normal; color: var(--red); display: block; }
  .lede { font-size: clamp(1.25rem, 2.6vw, 1.6rem); font-weight: 700; margin-top: 18px; max-width: 24ch; line-height: 1.2; }
  .btn { display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; background: var(--red); color: #fff; font-weight: 700; font-size: 1.1rem; border: 3px solid var(--ink); border-radius: 14px; padding: 14px 24px; text-decoration: none; box-shadow: 0 6px 0 var(--ink); transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
  .btn:hover { transform: translateY(3px); box-shadow: 0 3px 0 var(--ink); }
  .btn svg { width: 20px; height: 20px; }
  .parts { border: 3px solid var(--ink); border-radius: 14px; padding: 18px; background: #fff; }
  .parts h2 { font-family: var(--display); font-weight: 400; font-size: 1.15rem; margin-bottom: 12px; }
  .bricks { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .brick { position: relative; height: 54px; border: 3px solid var(--ink); border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: .9rem; padding: 0 8px; text-align: center; line-height: 1.1; }
  .brick::before, .brick::after { content: ""; position: absolute; top: -9px; width: 16px; height: 8px; border: 3px solid var(--ink); border-bottom: 0; border-radius: 4px 4px 0 0; background: inherit; }
  .brick::before { left: 16%; } .brick::after { right: 16%; }
  .b1 { background: var(--red); color: #fff; } .b2 { background: var(--yellow); } .b3 { background: #2f6fd6; color: #fff; } .b4 { background: #fff; } .b5 { background: #34b36a; } .b6 { background: var(--sky); }
  .bricks li:last-child:nth-child(odd) { grid-column: 1 / -1; }

  /* pasos */
  .step { display: grid; gap: 24px 40px; align-items: center; }
  @media (min-width: 900px) { .step { grid-template-columns: 96px 1.4fr 1fr; } }
  .step .num { font-size: clamp(4rem, 9vw, 6.4rem); }
  .board { position: relative; }
  .screen { position: relative; display: block; text-decoration: none; overflow: hidden; background: #fff; border: 4px solid var(--ink); border-radius: 10px; aspect-ratio: 16/10; }
  .screen img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; position: relative; z-index: 1; transition: transform 1s var(--ease); }
  .screen:hover img { transform: scale(1.04); }
  .screen .host { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 1.2rem; opacity: .25; }
  .screen .open { position: absolute; right: 12px; bottom: 12px; z-index: 2; background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; font-weight: 700; padding: 6px 14px; opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .35s var(--ease); }
  .screen:hover .open, .screen:focus-visible .open { opacity: 1; transform: none; }
  @media (hover: none) { .screen .open { opacity: 1; transform: none; } }
  /* llamada 1:1 con el logo */
  .call { position: absolute; left: -10px; top: -14px; z-index: 3; width: 74px; height: 74px; background: #fff; border: 3px solid var(--ink); border-radius: 12px; display: grid; place-items: center; transform: rotate(-4deg); }
  .call img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; }
  .call::after { content: ""; position: absolute; left: 30px; bottom: -14px; width: 3px; height: 14px; background: var(--ink); transform: rotate(20deg); transform-origin: top; }
  .arrow { position: absolute; right: 14px; top: -34px; width: 44px; height: 60px; z-index: 3; color: var(--red); }
  .info h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1; }
  .info p { margin-top: 14px; max-width: 46ch; font-weight: 500; }
  .tags { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .tags li { border: 3px solid var(--ink); border-radius: 8px; padding: 1px 12px; font-weight: 700; font-size: .9rem; background: var(--yellow); }
  .tags li:nth-child(2) { background: #fff; } .tags li:nth-child(3) { background: var(--sky); }
  .go { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; font-weight: 700; text-decoration: none; border-bottom: 3px solid var(--red); transition: gap .3s var(--ease); }
  .go:hover { gap: 14px; }
  .go svg { width: 18px; height: 18px; }

  /* la pieza cae siguiendo la flecha */
  .js .step .board { opacity: 0; transform: translateY(-46px); transition: opacity .3s, transform .7s cubic-bezier(.3, 1.5, .5, 1); }
  .js .step.in .board { opacity: 1; transform: none; }
  .js .step .info, .js .step .num { opacity: 0; transition: opacity .6s var(--ease) .25s; }
  .js .step.in .info, .js .step.in .num { opacity: 1; }
  @media (max-width: 899px) { .step .num { margin-bottom: -6px; } }

  /* final */
  .done { background: var(--yellow); }
  .done h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2.3rem, 8vw, 4.6rem); line-height: 1; text-wrap: balance; }
  .done h2 em { font-style: normal; color: var(--red); }
  .done > p { margin-top: 14px; max-width: 44ch; font-weight: 500; }
  .plates { list-style: none; padding: 0; margin-top: 32px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .plates a { display: block; background: var(--paper); border: 4px solid var(--ink); border-radius: 12px; padding: 16px 18px; text-decoration: none; box-shadow: 0 6px 0 var(--ink); transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
  .plates a:hover { transform: translateY(3px); box-shadow: 0 3px 0 var(--ink); }
  .plates .l { display: block; font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--red); }
  .plates .v { display: block; font-family: var(--display); font-size: clamp(1.15rem, 2.6vw, 1.45rem); overflow-wrap: anywhere; line-height: 1.15; margin-top: 2px; }
  footer { padding: 8px 0 40px; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .js .step .board, .js .step .info, .js .step .num { opacity: 1 !important; transform: none !important; transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="#top" id="top">MiguelicooMR1</a>
    <a class="c" href="#contacto">Contacto</a>
  </nav>

  <header class="sheet cover">
    <div>
      <h1>Miguelicoo<em>MR1</em></h1>
      <p class="lede">Ayudándote a mejorar tu negocio.</p>
      <a class="btn" href="#contacto">Hablemos
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
    <aside class="parts" aria-label="Qué hago">
      <h2>Piezas que necesitas</h2>
      <ul class="bricks">
        <li class="brick b1">Diseño web</li>
        <li class="brick b2">Desarrollo</li>
        <li class="brick b3">Eventos</li>
        <li class="brick b4">Negocios</li>
        <li class="brick b5">Reservas</li>
      </ul>
    </aside>
  </header>

  <main id="projects" aria-label="Proyectos"></main>

  <section class="sheet done" id="contacto">
    <h2>¿Tienes un proyecto? <em>Hablemos.</em></h2>
    <p>Cuéntame qué necesita tu negocio y lo vemos.</p>
    <ul class="plates" id="plates"></ul>
  </section>
  <footer>© <span id="year"></span> MiguelicooMR1</footer>
</div>

<script src="data.js"></script>
<script>
  document.documentElement.classList.add("js");
  const P = window.PORTFOLIO;
  const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
  const down = '<svg class="arrow" viewBox="0 0 44 60" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 4v44M8 34l14 14 14-14"/></svg>';

  const list = document.getElementById("projects");
  P.projects.forEach((p, i) => {
    const s = document.createElement("article");
    s.className = "sheet step";
    s.innerHTML =
      '<div class="num" aria-hidden="true">' + (i + 1) + '</div>' +
      '<div class="board"><div class="call"><img width="52" height="52"></div>' + down +
        '<a class="screen" target="_blank" rel="noopener noreferrer" aria-label="Visitar ' + p.name + '"><span class="host"></span><span class="open">Abrir web ↗</span></a></div>' +
      '<div class="info"><h3></h3><p class="d"></p><ul class="tags"></ul><a class="go" target="_blank" rel="noopener noreferrer"><span class="h"></span>' + arrow + '</a></div>';
    const a = s.querySelector(".screen"); a.href = p.url;
    s.querySelector(".host").textContent = P.host(p);
    P.shot(a, p);
    const call = s.querySelector(".call");
    const im = call.querySelector("img"); P.logo(im, p);
    im.addEventListener("error", () => call.remove());
    s.querySelector("h3").textContent = p.name;
    s.querySelector(".d").textContent = p.description;
    for (const t of p.tags) { const li = document.createElement("li"); li.textContent = t; s.querySelector(".tags").appendChild(li); }
    const g = s.querySelector(".go"); g.href = p.url; s.querySelector(".h").textContent = P.host(p);
    list.appendChild(s);
  });
  P.reveal(".step");

  const plates = document.getElementById("plates");
  for (const c of P.contact) {
    const li = document.createElement("li");
    li.innerHTML = '<a><span class="l"></span><span class="v"></span></a>';
    const a = li.firstChild; a.href = c.href;
    if (c.ext) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.querySelector(".l").textContent = c.label; a.querySelector(".v").textContent = c.value;
    plates.appendChild(li);
  }
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
